{% extends "layout.html" %}
{% block content %}

<div class="form-card">
    <h2>Two-Factor Authentication</h2>
    <p>Enter the 6-digit OTP sent to your system.</p>

    <form method="POST">
        <input type="text" name="otp" placeholder="Enter OTP" required>
        <button type="submit">Verify OTP</button>
    </form>
</div>

{% endblock %}
