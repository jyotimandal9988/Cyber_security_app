name: CI/CD Pipeline - Cyber Security App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────
  # JOB 1: LINT & TEST
  # ─────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Flake8 Linter
        run: |
          flake8 app.py --max-line-length=120 --ignore=E501,W503 --statistics

      - name: Run Pytest
        env:
          FLASK_ENV: testing
        run: |
          pytest tests/ -v --tb=short

  # ─────────────────────────────────────────
  # JOB 2: SECURITY SCAN
  # ─────────────────────────────────────────
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Safety - Check for known CVEs in dependencies
        run: |
          safety check -r requirements.txt --output text || true

      - name: Bandit - Static security analysis on source code
        run: |
          bandit -r app.py -ll -ii --format txt || true

  # ─────────────────────────────────────────
  # JOB 3: DEPLOY TO AWS ELASTIC BEANSTALK
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AWS Elastic Beanstalk CLI
        run: |
          python -m pip install --upgrade pip
          pip install awsebcli

      - name: Create deployment package (zip)
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "tests/*" \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude "requirements-dev.txt" \
            --exclude "instance/*" \
            --exclude "static/uploads/*" \
            --exclude ".env"

      - name: Deploy to Elastic Beanstalk
        run: |
          eb deploy cyber-security-env --staged --timeout 15
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
